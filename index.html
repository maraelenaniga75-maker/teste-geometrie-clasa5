{q:"Dacă AB = 60 cm și BC = 15 cm, cu B între A și C, AC este:",a:["45 cm","75 cm","900 cm","60 cm"],c:1},
{q:"Dacă AC = 140 cm și AB = 88 cm, cu B între A și C, BC este:",a:["52 cm","228 cm","88 cm","140 cm"],c:0},
{q:"Pe o dreaptă, A(10) și B(100). Distanța AB este:",a:["90","100","110","1000"],c:0},
{q:"Dacă AB = 2 × 18 cm, atunci AB este:",a:["18 cm","20 cm","36 cm","40 cm"],c:2},
{q:"Dacă AB = 200 cm și M este mijlocul, MB este:",a:["50 cm","100 cm","200 cm","400 cm"],c:1},
{q:"Dacă M este mijlocul și AM = 80 cm, atunci AB este:",a:["80 cm","160 cm","40 cm","240 cm"],c:1},
{q:"A și B sunt simetrice față de O. Dacă AB = 200 cm, AO este:",a:["50 cm","100 cm","200 cm","400 cm"],c:1},
{q:"Simetricul punctului A față de punctul O este unic?",a:["Da","Nu","Doar uneori","Nu se poate ști"],c:0}
]
];

let currentTest=0, i=0, score=0, answered=false;
const select=document.getElementById("testSelect");
for(let t=0;t<tests.length;t++){select.innerHTML+=`<option value="${t}">Test ${t+1}</option>`;}
function selectTest(t){currentTest=parseInt(t);i=0;score=0;load();}
function load(){answered=false;let questions=tests[currentTest];document.getElementById("number").innerText=`Test ${currentTest+1} - Întrebarea ${i+1} din ${questions.length}`;document.getElementById("q").innerText=questions[i].q;let ans="";questions[i].a.forEach((el,idx)=>{ans+=`<button class="answer" onclick="check(${idx}, this)">${String.fromCharCode(65+idx)}. ${el}</button>`});document.getElementById("answers").innerHTML=ans;document.getElementById("feedback").innerText="";document.querySelector(".next").style.display="none";document.querySelector(".restart").style.display="none";document.getElementById("score").innerText=`Scor: ${score} / ${i}`;}
function check(sel,btn){if(answered)return;answered=true;let q=tests[currentTest][i];let buttons=document.querySelectorAll(".answer");if(sel===q.c){btn.classList.add("correct");document.getElementById("feedback").innerText="Corect!";score++;}else{btn.classList.add("wrong");buttons[q.c].classList.add("correct");document.getElementById("feedback").innerText="Greșit! Varianta corectă este evidențiată cu verde.";}document.getElementById("score").innerText=`Scor: ${score} / ${i+1}`;if(i<tests[currentTest].length-1){document.querySelector(".next").style.display="block";}else{finish();}}
function nextQ(){i++;load();}
function finish(){let total=tests[currentTest].length;let nota=((score/total)*10).toFixed(2);document.getElementById("feedback").innerText += ` Test finalizat! Nota aproximativă: ${nota}.`;document.querySelector(".restart").style.display="block";}
function restartTest(){i=0;score=0;load();}
load();
</script>
