<!DOCTYPE html>

<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Teste Matematica</title>
<style>
body{font-family:Arial;background:#0b1d51;color:white;text-align:center;padding:20px}
.container{max-width:900px;margin:auto}
button{padding:12px;margin:10px;border:none;border-radius:10px;cursor:pointer}
.testBtn{background:gold;color:black;font-size:18px}
.answer{background:white;color:black;width:80%}
</style>
</head>

<body>

<div class="container">

<h1>Alege testul</h1>

<button class="testBtn" onclick="startTest(0)">Clasa a V-a - Geometrie</button> <button class="testBtn" onclick="startTest(1)">Clasa a VI-a - Numere întregi</button>

<div id="game" style="display:none">
<h2 id="q"></h2>
<div id="answers"></div>
<p id="feedback"></p>
<button onclick="nextQ()">Continuă</button>
</div>

</div>

<script>

const tests = [

/* TEST CLASA V */
[
{q:"AB=5 cm, BC=7 cm. AC=?",a:["12","2","35","10"],c:0},
{q:"Simetricul lui A față de O?",a:["B","C","A","D"],c:0}
],

/* TEST CLASA VI */
[
{q:"(-7)+(-5)=",a:["-12","12","-2","2"],c:0},
{q:"|−9|=",a:["-9","9","0","18"],c:1}
]

];

let t=0,i=0;

function startTest(x){
t=x;
i=0;
document.getElementById("game").style.display="block";
load();
}

function load(){
let q=tests[t][i];
document.getElementById("q").innerText=q.q;
let html="";
q.a.forEach((a,idx)=>{
html+=`<button class='answer' onclick='check(${idx})'>${a}</button>`;
});
document.getElementById("answers").innerHTML=html;
document.getElementById("feedback").innerText="";
}

function check(x){
let q=tests[t][i];
if(x===q.c){
document.getElementById("feedback").innerText="Corect";
}else{
document.getElementById("feedback").innerText="Greșit";
}
}

function nextQ(){
i++;
if(i<tests[t].length){
load();
}else{
alert("Test finalizat!");
}
}

</script>

</body>
</html>
